
# `docker compose up` is the whole setup: database, migrations, seed catalogue and API.
# Nothing to install, no connection string to edit.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: posledger
      POSTGRES_USER: posledger
      POSTGRES_PASSWORD: posledger
    ports:
      # Exposed so you can point psql or a GUI at it while the stack runs.
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # The API waits for this: Postgres accepts TCP connections a moment before it
      # is ready to answer queries, and starting the API in that gap fails the migration.
      test: ["CMD-SHELL", "pg_isready -U posledger -d posledger"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DATABASE_URL: postgres://posledger:posledger@db:5432/posledger
      # One instance, no release pipeline: migrating and seeding at startup is the
      # right call here and the wrong one in a real deployment. See ADR-0005.
      Database__MigrateOnStartup: "true"
      Database__SeedOnStartup: "true"
    ports:
      - "8080:8080"

volumes:
  pgdata:
