version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for the whole framework rather than eight that have to land together.
      aspnetcore:
        patterns: ['Microsoft.AspNetCore.*', 'Microsoft.Extensions.*']
      efcore:
        patterns: ['Microsoft.EntityFrameworkCore.*', 'Npgsql.EntityFrameworkCore.*', 'EFCore.*']
    ignore:
      # The EF Core tool has to match the EF Core runtime it generates migrations for, and
      # a 10.x tool needs the .NET 10 runtime just to start. Nothing in CI runs `dotnet ef`,
      # so this bump passes every check while breaking migrations for anyone with only the
      # .NET 8 SDK installed — a green tick over a broken workflow.
      - dependency-name: 'dotnet-ef'
        update-types: ['version-update:semver-major']

      # FluentAssertions 8 left Apache 2.0 for the Xceed Community License: free for
      # non-commercial use, USD 130 per developer per year otherwise. Version 7 stays free
      # indefinitely. Moving off 6.x is a licensing decision for a human to make, not a
      # version bump — and shipping a public repository whose test suite quietly obliges a
      # reader's employer to buy a licence is not a favour to anyone.
      - dependency-name: 'FluentAssertions'
        update-types: ['version-update:semver-major']

      # The efcore group only covers src/PosLedger.Api, so a major lands EF Core 9.0.18 in
      # the API (pulled by Design) and 9.0.1 in the test project (the floor Npgsql asks for),
      # and the build dies on CS1705. Moving to EF Core 9 means the three packages, the
      # dotnet-ef tool and a re-scaffold of the migrations in one commit. That is a migration
      # with a person behind it, and until someone does it this PR can only ever be red.
      - dependency-name: 'Microsoft.EntityFrameworkCore.*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'Npgsql.EntityFrameworkCore.*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'EFCore.NamingConventions'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # One PR a week for the whole pipeline. Five separate PRs, each re-running the
      # full test suite against a real Postgres, is a lot of CI minutes spent to review
      # five one-line diffs that always land together anyway.
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # The base images are pinned to the framework the project targets. A major bump is
    # not a dependency update, it is a framework migration: it has to move the TFM, the
    # setup-dotnet version in CI and these two images in one commit, or the build breaks.
    # Dependabot opened exactly that PR on day one; this is why it will not again.
    # Named 'dotnet/*', not 'mcr.microsoft.com/dotnet/*': dependabot strips the registry
    # host, so the fully qualified form matches nothing and the rule silently does nothing.
    ignore:
      - dependency-name: 'dotnet/*'
        update-types: ['version-update:semver-major']
